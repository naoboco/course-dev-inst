<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>

    <form id="register-form">
        <input
            type="text"
            id="first_name"
            placeholder="Name"
            required
        >

        <input
            type="text"
            id="last_name"
            placeholder="Last Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button
            type="submit"
            id="register-button"
            disabled
        >
            Register
        </button>
    </form>

    <p id="message"></p>

    <p>
        Already registered?
        <a href="/login.html">Login</a>
    </p>

    <script src="register.js"></script>
</body>
</html>
