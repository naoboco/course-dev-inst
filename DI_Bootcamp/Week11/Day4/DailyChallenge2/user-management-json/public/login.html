<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    <form id="login-form">
        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button
            type="submit"
            id="login-button"
            disabled
        >
            Login
        </button>
    </form>

    <p id="message"></p>

    <p>
        No account yet?
        <a href="/register.html">Register</a>
    </p>

    <script src="login.js"></script>
</body>
</html>
