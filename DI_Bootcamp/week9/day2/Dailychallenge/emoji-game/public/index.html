<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Emoji Guessing Game</h1>

        <div id="start-screen">
            <input
                id="player-name"
                type="text"
                placeholder="Enter your name"
            >

            <button id="start-button">
                Start Game
            </button>
        </div>

        <div id="game-screen" class="hidden">

            <h2 id="player-display"></h2>

            <p>
                Score:
                <span id="score">0</span>
            </p>

            <div id="emoji"></div>

            <form id="guess-form">

                <div id="options"></div>

                <button type="submit">
                    Submit Guess
                </button>

            </form>

            <p id="feedback"></p>

        </div>

        <div id="leaderboard">

            <h2>Leaderboard</h2>

            <ol id="leaderboard-list"></ol>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
